name: Build and smoke-test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release|x64
        run: |
          msbuild FiveBodyHierarchy.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Smoke-test (run with sample data)
        working-directory: FiveBody
        run: |
          ..\x64\Release\FiveBody.exe data\filenames.txt

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: out_sample
          path: FiveBody/out_sample.txt
